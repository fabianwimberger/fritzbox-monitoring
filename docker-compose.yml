services:
  fritzbox-exporter:
    build: .
    container_name: fritzbox-exporter
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - fritzbox-exporter-data:/app/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  fritzbox-exporter-data:
