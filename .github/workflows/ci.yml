name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install '.[dev]'

      - name: Lint with ruff
        run: .venv/bin/python -m ruff check exporter.py tests/

      - name: Format check with ruff
        run: .venv/bin/python -m ruff format --check exporter.py tests/

      - name: Type check with mypy
        run: .venv/bin/python -m mypy exporter.py tests/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install '.[dev]'

      - name: Run tests
        run: .venv/bin/python -m pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t fritzbox-monitoring:test .

      - name: Test container serves metrics
        run: |
          # Point the scrape at localhost so it fails fast instead of waiting
          # on a real FritzBox that does not exist in CI.
          docker run -d --name fritzbox-test -p 18000:8000 \
            -e FRITZBOX_IP=127.0.0.1 -e PING_TARGET=127.0.0.1 \
            fritzbox-monitoring:test

          ok=0
          for _ in $(seq 1 20); do
            if curl -sf --max-time 20 http://127.0.0.1:18000/metrics -o /tmp/metrics.txt; then
              ok=1
              break
            fi
            sleep 2
          done

          docker logs fritzbox-test
          docker stop fritzbox-test

          if [ "$ok" != "1" ]; then
            echo "metrics endpoint did not respond"
            exit 1
          fi

          grep -q '^fritzbox_up' /tmp/metrics.txt
