[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["exporter"]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "BLE001", # broad except-Exception is intentional: isolates per-channel/per-collector failures
    "S112",   # try-except-continue in host enumeration is intentional: skip unreadable entries
]
