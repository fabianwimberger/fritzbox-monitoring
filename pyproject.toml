[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fritzbox-monitoring"
version = "1.2.6"
description = "Prometheus exporter for AVM FRITZ!Box cable modems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "prometheus-client==0.26.0",
    "pingparsing==1.4.2",
    "requests==2.34.2",
    "fritzconnection==1.15.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-requests==2.33.0.20260906",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools]
py-modules = ["exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["exporter"]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "BLE001", # broad except-Exception is intentional: isolates per-channel/per-collector failures
    "S112",   # try-except-continue in host enumeration is intentional: skip unreadable entries
]
