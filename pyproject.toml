[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fritzbox-monitoring"
version = "1.2.3"
description = "Prometheus exporter for AVM FRITZ!Box cable modems"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["exporter"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["exporter"]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "BLE001", # broad except-Exception is intentional: isolates per-channel/per-collector failures
    "S112",   # try-except-continue in host enumeration is intentional: skip unreadable entries
]
